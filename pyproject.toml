[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-engine"
version = "2.0.0"
description = "Concurrent, exact replacement for a flawed legacy transaction pipeline, with measured before/after benchmarks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Souq AL_Bostan" }]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.122.3",
    "ruff==0.8.2",
    "mypy==1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.coverage.run]
source = ["refactor_engine"]
branch = true
